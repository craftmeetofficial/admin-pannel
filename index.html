<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — NK ACCOUNTS</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .admin-container {
      max-width: 900px;
      margin: 120px auto 60px auto;
      padding: 0 20px;
    }
    .login-box, .dashboard-box {
      background: #12121a;
      border: 1px solid #1f1f2e;
      border-radius: 12px;
      padding: 30px;
    }
    .admin-card {
      background: #1a1a26;
      border: 1px solid #2a2a3d;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .logout-btn {
      background: #ff4757 !important;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    .action-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-edit {
      background: #ffa502;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-delete {
      background: #ff4757;
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <!-- Navigation -->
  <header class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <span class="logo-nk">NK</span>
        <span class="logo-accounts">ACCOUNTS</span>
      </a>
      <nav class="nav-links" id="navLinks">
        <a href="index.html" class="nav-link">Home</a>
        <a href="about.html" class="nav-link">About Us</a>
        <a href="contact.html" class="nav-link">Contact</a>
      </nav>
    </div>
  </header>

  <main class="admin-container">
    <!-- Login Section -->
    <div id="loginSection" class="login-box">
      <h2 class="section-title" style="text-align: left; margin-bottom: 20px;">Admin Login</h2>
      <form id="loginForm" class="contact-form">
        <div class="form-group">
          <label for="adminEmail">Email Address</label>
          <input type="email" id="adminEmail" required placeholder="admin@nkaccounts.com">
        </div>
        <div class="form-group">
          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-full">Login to Dashboard</button>
      </form>
    </div>

    <!-- Dashboard Section (Only visible when logged in) -->
    <div id="dashboardSection" class="dashboard-box" hidden>
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2 class="section-title" style="margin: 0; text-align: left;">Admin Control Panel</h2>
        <button id="logoutBtn" class="logout-btn">Logout</button>
      </div>

      <!-- Add / Edit Listing Form -->
      <div class="admin-card" style="margin-bottom: 30px;">
        <h3 id="formHeading" style="color: #fff; margin-bottom: 15px;">Add New Listing</h3>
        <form id="addListingForm">
          <input type="hidden" id="editListingId">
          <div class="form-row">
            <div class="form-group">
              <label for="listTitle">Listing Title</label>
              <input type="text" id="listTitle" required placeholder="e.g. eBay Verified Seller Account">
            </div>
            <div class="form-group">
              <label for="listCategory">Category</label>
              <input type="text" id="listCategory" required placeholder="e.g. eBay">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="listPrice">Price ($)</label>
              <input type="number" id="listPrice" required placeholder="45.00">
            </div>
            <div class="form-group">
              <label for="listRef">Reference ID</label>
              <input type="text" id="listRef" required placeholder="NK-0045">
            </div>
          </div>
          <div class="form-group">
            <label for="listDesc">Description</label>
            <textarea id="listDesc" rows="3" required placeholder="Account details..."></textarea>
          </div>
          <div style="display: flex; gap: 10px;">
            <button type="submit" id="submitBtn" class="btn btn-primary">Publish Listing</button>
            <button type="button" id="cancelEditBtn" class="btn btn-outline" style="display:none;" onclick="resetForm()">Cancel Edit</button>
          </div>
        </form>
      </div>

      <!-- Manage Existing Listings -->
      <div class="admin-card" style="margin-bottom: 30px;">
        <h3 style="color: #fff; margin-bottom: 15px;">Manage Listings</h3>
        <div id="manageListingsList">
          <p style="color: #8a8a9e;">Loading listings...</p>
        </div>
      </div>

      <!-- Client Messages -->
      <div class="admin-card">
        <h3 style="color: #fff; margin-bottom: 15px;">Client Messages</h3>
        <div id="messagesList">
          <p style="color: #8a8a9e;">Loading messages...</p>
        </div>
      </div>
    </div>
  </main>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, push, set, update, remove, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBXycN3dBMmSO2n3Dc2vQDmK_mOO3XJ22M",
      authDomain: "nk-accounts.firebaseapp.com",
      databaseURL: "https://nk-accounts-default-rtdb.firebaseio.com",
      projectId: "nk-accounts",
      storageBucket: "nk-accounts.firebasestorage.app",
      messagingSenderId: "647793698356",
      appId: "1:647793698356:web:3ee8a12ab0265f125b0c61",
      measurementId: "G-BKPP3B4LVB"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const database = getDatabase(app);

    const loginSection = document.getElementById("loginSection");
    const dashboardSection = document.getElementById("dashboardSection");
    const loginForm = document.getElementById("loginForm");
    const logoutBtn = document.getElementById("logoutBtn");
    const messagesList = document.getElementById("messagesList");
    const addListingForm = document.getElementById("addListingForm");
    const manageListingsList = document.getElementById("manageListingsList");
    const formHeading = document.getElementById("formHeading");
    const submitBtn = document.getElementById("submitBtn");
    const cancelEditBtn = document.getElementById("cancelEditBtn");
    const editListingId = document.getElementById("editListingId");

    let allListingsData = {};

    // Login Handle
    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const email = document.getElementById("adminEmail").value.trim();
      const password = document.getElementById("adminPassword").value;

      signInWithEmailAndPassword(auth, email, password)
        .catch((error) => {
          alert("Login Failed: " + error.message);
        });
    });

    // Logout Handle
    logoutBtn.addEventListener("click", () => {
      signOut(auth);
    });

    // Auth State
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginSection.hidden = true;
        dashboardSection.hidden = false;
        loadMessages();
        loadManageListings();
      } else {
        loginSection.hidden = false;
        dashboardSection.hidden = true;
      }
    });

    // Add or Update Listing Form Submit
    addListingForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("listTitle").value.trim();
      const category = document.getElementById("listCategory").value.trim();
      const price = document.getElementById("listPrice").value.trim();
      const refId = document.getElementById("listRef").value.trim();
      const description = document.getElementById("listDesc").value.trim();
      const listingId = editListingId.value;

      const listingsRef = ref(database, 'listings');

      if (listingId) {
        // Update existing listing
        const specificListingRef = ref(database, 'listings/' + listingId);
        update(specificListingRef, {
          title,
          category,
          price,
          refId,
          description
        })
        .then(() => {
          alert("Listing updated successfully!");
          resetForm();
        })
        .catch((error) => {
          alert("Error updating: " + error.message);
        });
      } else {
        // Add new listing
        push(listingsRef, {
          title,
          category,
          price,
          refId,
          description,
          createdAt: new Date().toISOString()
        })
        .then(() => {
          alert("Listing published successfully!");
          addListingForm.reset();
        })
        .catch((error) => {
          alert("Error: " + error.message);
        });
      }
    });

    // Load Listings for Management (Edit / Delete)
    function loadManageListings() {
      const listingsRef = ref(database, 'listings');
      onValue(listingsRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          manageListingsList.innerHTML = "<p style='color: #8a8a9e;'>No listings found.</p>";
          allListingsData = {};
          return;
        }

        allListingsData = data;
        let html = "";
        Object.keys(data).forEach((key) => {
          const item = data[key];
          html += `
            <div style="background: #12121a; border: 1px solid #2a2a3d; padding: 15px; border-radius: 6px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;">
              <div>
                <strong style="color: #fff; font-size: 1rem;">${item.title}</strong>
                <div style="font-size: 0.85rem; color: #8a8a9e; margin-top: 3px;">Category: ${item.category} | Price: $${item.price} | Ref: ${item.refId}</div>
              </div>
              <div class="action-btn-group">
                <button class="btn-edit" onclick="prepareEdit('${key}')">Edit</button>
                <button class="btn-delete" onclick="deleteListing('${key}')">Delete</button>
              </div>
            </div>
          `;
        });
        manageListingsList.innerHTML = html;
      });
    }

    // Prepare Form for Editing
    window.prepareEdit = function(key) {
      const item = allListingsData[key];
      if (!item) return;

      editListingId.value = key;
      document.getElementById("listTitle").value = item.title;
      document.getElementById("listCategory").value = item.category;
      document.getElementById("listPrice").value = item.price;
      document.getElementById("listRef").value = item.refId;
      document.getElementById("listDesc").value = item.description;

      formHeading.textContent = "Edit Listing";
      submitBtn.textContent = "Update Listing";
      cancelEditBtn.style.display = "inline-block";

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Reset Form back to Add mode
    window.resetForm = function() {
      addListingForm.reset();
      editListingId.value = "";
      formHeading.textContent = "Add New Listing";
      submitBtn.textContent = "Publish Listing";
      cancelEditBtn.style.display = "none";
    }

    // Delete Listing Function
    window.deleteListing = function(key) {
      if (confirm("Are you sure you want to delete this listing?")) {
        const itemRef = ref(database, 'listings/' + key);
        remove(itemRef)
          .then(() => {
            alert("Listing deleted successfully!");
          })
          .catch((error) => {
            alert("Error deleting: " + error.message);
          });
      }
    }

    // Load Messages
    function loadMessages() {
      const messagesRef = ref(database, 'contacts');
      onValue(messagesRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          messagesList.innerHTML = "<p style='color: #8a8a9e;'>No messages received yet.</p>";
          return;
        }

        let html = "";
        Object.keys(data).forEach((key) => {
          const msg = data[key];
          html += `
            <div style="background: #12121a; border: 1px solid #2a2a3d; padding: 15px; border-radius: 6px; margin-bottom: 10px;">
              <div style="display: flex; justify-content: space-between; font-size: 0.85rem; color: #8a8a9e; margin-bottom: 5px;">
                <span>From: <strong>${msg.name}</strong> (${msg.email})</span>
                <span>${new Date(msg.timestamp).toLocaleString()}</span>
              </div>
              <div style="font-weight: 600; color: #fff; margin-bottom: 5px;">Subject: ${msg.subject}</div>
              <p style="color: #d1d1e0; font-size: 0.95rem; margin: 0;">${msg.message}</p>
            </div>
          `;
        });
        messagesList.innerHTML = html;
      });
    }
  </script>
</body>
</html>
